server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # add_header inside a location drops the server ones, so every location includes the set
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  location ~* \.(?:woff2?|jpg|png|svg)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  location ~* \.(?:css|js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
}
